name: video
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'video url (YouTube or m3u8 streaming url)'
        required: true
        default: ''
      parallel:
        description: 'parallel count (for m3u8 streams)'
        required: false
        default: 10
      quality:
        description: 'preferred quality for YouTube (e.g. 1080p,720p,best)'
        required: false
        default: '1080p,720p,best'
      name:
        description: 'output filename'
        required: false
        default: 'video.mp4'
      target:
        description: 'upload target directory'
        required: false
        default: 'videos'
      delay:
        description: 'delay second before upload'
        required: false
        default: 0

jobs:
  video:
    runs-on: ubuntu-latest
    env:
      go: '1.17'

    steps:
    - name: Use Go ${{ env.go }}
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.go }}

    - name: Checkout
      timeout-minutes: 1
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install FFmpeg
      run: |
        curl -fsSL https://github.com/tiechui1994/actions/releases/download/ffmpeg_5.1/ffmpeg.tar.xz -o "$RUNNER_TEMP/ffmpeg.tar.xz"
        tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP"
        chmod +x "$RUNNER_TEMP/ffmpeg/ffmpeg" "$RUNNER_TEMP/ffmpeg/ffprobe"
        echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"

    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        repository: 'tiechui1994/deno'
        token: ${{ secrets.GIT_TOKEN }}
        path: './deno'
    - name: 安装 yq
      uses: mikefarah/yq@master

    - name: 修改 proxyGroup
      run: |
        curl ${{secrets.PROXY_URL}} -L -o config.yaml
        yq eval '(.proxy-groups[] | select(.name == "Streaming").proxies) = ["🎬负载视频"]' -i config.yaml
        yq eval '
            (.proxy-groups[] | select(.name == "🎬负载视频")) |= (
              .url = "http://www.gstatic.com/generate_204",
              .interval = 60,
              .max-failed-times = 1,
              .strategy = "round-robin",
              .live = false
            )
          ' -i config.yaml
        yq eval '.rules = .rules[0:1] + ["DOMAIN-SUFFIX,aliyundrive.com,🎬负载视频"] + .rules[1:]' -i config.yaml
      shell: bash
      
    - uses: ./deno/action/mihomo
      with: 
        config-url: config.yaml

    - name: Download and Upload
      run: |
        make -C golang video
        sleep "$DELAY"
        golang/video -name "$NAME" -url "$VIDEO_URL" -batch "$PARALLEL" -quality "$QUALITY" -proxy "http://127.0.0.1:7890"

        arr=($(du -mh $NAME))
        echo "${arr[1]} size: ${arr[0]}B"
        make -C golang upload
        golang/upload -upload -file "$NAME" -dir "$TARGET" -proxy "http://127.0.0.1:7890"
      env:
        NAME: ${{github.workspace}}/${{github.event.inputs.name}}
        VIDEO_URL: ${{github.event.inputs.url}}
        PARALLEL: ${{github.event.inputs.parallel}}
        QUALITY: ${{github.event.inputs.quality}}
        DELAY: ${{github.event.inputs.delay}}
        TARGET: ${{github.event.inputs.target}}
        ALIDRIVE_TOKEN: ${{secrets.ALIDRIVE_TOKEN}}
