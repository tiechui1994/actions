name: streamlit
on:
  workflow_dispatch:
    inputs:

jobs:
  streamlit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Env
        run: |
          echo "PACKAGE=${{github.workspace}}/nodejs/package-lock.json" >> $GITHUB_ENV
        
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ${{ env.PACKAGE }}
          
      - name: Run
        run: |
          cd nodejs && npm install && node streamlit.js 
        shell: bash
