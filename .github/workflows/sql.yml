name: build-mysql-8.0.16-windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      VS_BUILDTOOLS: C:\BuildTools
      OPENSSL_INSTALL: C:\openssl-1.1.1n
      MYSQL_SRC_URL: https://downloads.mysql.com/archives/get/p/23/file/mysql-boost-8.0.16.tar.gz

    steps:
      # MySQL 8.0.16 官方仅支持 VS2017 (v141) 工具集。
      # 独立安装 VS2022 Build Tools + v141 到固定路径，不修改镜像预装的 VS，避免安装器挂死
      - name: Install VS2022 Build Tools with v141 toolset
        shell: pwsh
        timeout-minutes: 40
        run: |
          curl.exe -fL -o vs_buildtools.exe https://aka.ms/vs/17/release/vs_buildtools.exe
          $p = Start-Process -Wait -PassThru .\vs_buildtools.exe -ArgumentList @(
                 '--quiet','--wait','--norestart','--nocache',
                 '--installPath', $env:VS_BUILDTOOLS,
                 '--add','Microsoft.VisualStudio.Workload.VCTools',
                 '--add','Microsoft.VisualStudio.Component.VC.v141.x86.x64',
                 '--add','Microsoft.VisualStudio.Component.Windows10SDK.19041',
                 '--includeRecommended')
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "vs_buildtools.exe exit code: $($p.ExitCode)"
          }
          $v141 = Get-ChildItem "$env:VS_BUILDTOOLS\VC\Tools\MSVC" | Where-Object Name -like '14.16*'
          if (-not $v141) { throw 'v141 toolset not found after install' }
          Write-Host "v141 toolset installed: $($v141.Name)"

      # 8.0.16 的老 CMake 脚本无法在新版 CMake 上配置，固定 3.21.7
      # (3.21 恰好开始支持 "Visual Studio 17 2022" 生成器)
      - name: Install CMake 3.21.7
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.21.7'

      - name: Install NASM and bison
        shell: pwsh
        run: |
          choco install -y nasm winflexbison3
          $bisonDir = 'C:\ProgramData\chocolatey\lib\winflexbison3\tools'
          Copy-Item "$bisonDir\win_bison.exe" "$bisonDir\bison.exe"
          Add-Content $env:GITHUB_PATH 'C:\Program Files\NASM'
          Add-Content $env:GITHUB_PATH $bisonDir

      # 用 Build Tools 的 vcvarsall 进入 v141 环境，编译 OpenSSL 1.1.1n
      # (镜像自带 Strawberry Perl，无需额外安装)
      - name: Build OpenSSL 1.1.1n
        shell: cmd
        run: |
          call "%VS_BUILDTOOLS%\VC\Auxiliary\Build\vcvarsall.bat" x64 -vcvars_ver=14.16
          curl -fL -o openssl.tar.gz https://github.com/openssl/openssl/archive/refs/tags/OpenSSL_1_1_1n.tar.gz
          tar xf openssl.tar.gz
          cd openssl-OpenSSL_1_1_1n
          perl Configure VC-WIN64A no-tests --prefix=%OPENSSL_INSTALL% --openssldir=%OPENSSL_INSTALL%\ssl
          nmake
          nmake install_sw

      # mysql-boost 源码包内置 Boost 1.69.0（8.0.16 强制要求的版本）
      - name: Download MySQL 8.0.16 source
        shell: cmd
        run: |
          curl -fL -o mysql-src.tar.gz "%MYSQL_SRC_URL%"
          tar xf mysql-src.tar.gz

      # "Visual Studio 17 2022" 生成器只会匹配 VS 17.x 实例，
      # 镜像预装的 VS2026 (18.x) 不会被误选，命中的正是 C:\BuildTools
      - name: Configure
        shell: cmd
        working-directory: mysql-8.0.16
        run: |
          mkdir bld
          cd bld
          cmake .. -G "Visual Studio 17 2022" -A x64 -T v141 ^
            -DWITH_BOOST=%GITHUB_WORKSPACE%\mysql-8.0.16\boost\boost_1_69_0 ^
            -DWITH_SSL=%OPENSSL_INSTALL% ^
            -DWITH_UNIT_TESTS=0 ^
            -DCMAKE_INSTALL_PREFIX=C:\mysql-8.0.16

      - name: Build
        shell: cmd
        working-directory: mysql-8.0.16\bld
        run: cmake --build . --config RelWithDebInfo -- /m

      - name: Package (zip)
        shell: cmd
        working-directory: mysql-8.0.16\bld
        run: cpack -G ZIP -C RelWithDebInfo

      # MySQL 动态链接 OpenSSL，运行时需要这两个 DLL，随产物一起上传
      - name: Collect OpenSSL DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force openssl-dlls | Out-Null
          Copy-Item "$env:OPENSSL_INSTALL\bin\libssl-1_1-x64.dll",
                    "$env:OPENSSL_INSTALL\bin\libcrypto-1_1-x64.dll" openssl-dlls\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mysql-8.0.16-winx64
          path: |
            mysql-8.0.16/bld/*.zip
            openssl-dlls/*.dll